<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects — Isma Tiara</title><link rel="preconnect" href="https://fonts.bunny.net"><link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800&family=fraunces:500,600,700" rel="stylesheet"><style>:root{--ink:#25266e;--muted:#737ba5;--violet:#6250d6;--line:#e5e8fa}*{box-sizing:border-box}body{margin:0;font-family:Figtree,sans-serif;color:var(--ink);background:radial-gradient(circle at 90% 0,#e8e2ff,transparent 26rem),#fbfcff}a{text-decoration:none;color:inherit}.nav,.wrap{max-width:1180px;margin:auto;padding-left:22px;padding-right:22px}.nav{height:78px;display:flex;align-items:center;justify-content:space-between}.logo{width:108px;height:50px;object-fit:contain;object-position:left}.back,.filter{border:1px solid #dadcf4;border-radius:999px;padding:10px 15px;background:#fff;color:var(--violet);font-weight:800;font-size:13px;cursor:pointer}.hero{padding:58px 0 32px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8d71db;font-weight:800}.eyebrow:before{content:'✦ ';color:#f3b643}h1{font:600 clamp(42px,7vw,74px)/.95 Fraunces,serif;margin:12px 0;color:#292978}h1 em{color:#7466dd}.intro{max-width:560px;line-height:1.7;color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:16px 0 26px}.filter.active{background:var(--violet);color:#fff;border-color:var(--violet)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;padding-bottom:60px}.card{overflow:hidden;background:#ffffffd9;border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 36px -27px #47408c;transition:.2s}.card:hover{transform:translateY(-5px)}.media{height:190px;background:linear-gradient(135deg,#eeeaff,#b8d3ff,#ffe4a7);display:grid;place-items:center;font-size:38px;font-weight:800;color:#6555cc}.media img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.tag{font-size:10px;color:#6858d1;font-weight:800;text-transform:uppercase}.body h2{margin:7px 0;font-size:19px}.body p{font-size:13px;line-height:1.55;color:var(--muted);margin:0}.open{display:inline-block;margin-top:13px;font-weight:800;font-size:12px;color:var(--violet)}dialog{width:min(840px,92vw);border:0;border-radius:24px;padding:0;box-shadow:0 30px 90px #17133a77}dialog::backdrop{background:#171333a6}.modal{background:#fff}.modal-head{display:flex;justify-content:space-between;gap:10px;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0}.close{border:0;background:#f0efff;border-radius:50%;width:34px;height:34px;font-size:19px;cursor:pointer}.detail-image{max-height:430px;width:100%;object-fit:contain;background:#f4f4ff}.detail-copy{padding:20px 22px;color:var(--muted);line-height:1.65}.detail-copy a{color:var(--violet);font-weight:800}.thumbs{display:flex;gap:8px;overflow:auto;padding:0 22px 20px}.thumbs button{width:64px;height:54px;padding:0;flex:none;border:2px solid transparent;border-radius:9px;overflow:hidden;background:#eee}.thumbs button.active{border-color:var(--violet)}.thumbs img{width:100%;height:100%;object-fit:cover}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding-top:35px}}</style></head><body><nav class="nav"><a href="index.html"><img class="logo" src="assets/images/logo-isma.jpeg" alt="Isma Portfolio"></a><a class="back" href="index.html#projects">← Kembali ke portfolio</a></nav><main class="wrap"><section class="hero"><p class="eyebrow">Selected work</p><h1>Projects with <em>purpose.</em></h1><p class="intro">Koleksi karya yang saya kerjakan, dari sistem administrasi dan aplikasi hingga desain digital. Klik kartu untuk melihat detail dan galeri foto.</p></section><div id="filters" class="toolbar"></div><section id="list" class="grid"></section></main><dialog id="dialog"><article class="modal"><div class="modal-head"><div><span id="meta" class="tag"></span><h2 id="title"></h2></div><button class="close" aria-label="Tutup">×</button></div><img id="image" class="detail-image" alt=""><div id="thumbs" class="thumbs"></div><div id="description" class="detail-copy"></div></article></dialog><script src="data.js"></script><script>(async()=>{const data=await getData();const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let active='All';const pics=p=>[p.thumbnail,...(p.gallery||[])].filter(Boolean);const list=$('#list');function show(p){const photos=pics(p);$('#title').textContent=p.nama_proyek;$('#meta').textContent=[p.kategori_id,p.tahun,p.status].filter(Boolean).join(' · ');$('#description').innerHTML=`<p>${esc(p.deskripsi_lengkap||p.deskripsi_singkat||'')}</p>${p.demo_url?`<a href="${esc(p.demo_url)}" target="_blank">Live Demo ↗</a>`:''}${p.github_url?` &nbsp; <a href="${esc(p.github_url)}" target="_blank">GitHub ↗</a>`:''}`;const set=src=>{$('#image').src=src||'';$('#image').alt=p.nama_proyek;$('#thumbs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.src===src))};$('#thumbs').innerHTML=photos.map((s,i)=>`<button class="${i?'':'active'}" data-src="${s}"><img src="${s}" alt="Foto ${i+1}"></button>`).join('');$('#thumbs').querySelectorAll('button').forEach(b=>b.onclick=()=>set(b.dataset.src));if(photos[0])set(photos[0]);else{$('#image').removeAttribute('src');$('#thumbs').innerHTML=''}$('#dialog').showModal()}function render(){const cats=['All',...new Set(data.projects.map(p=>p.kategori_id).filter(Boolean))];$('#filters').innerHTML=cats.map(c=>`<button class="filter ${c===active?'active':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');const items=active==='All'?data.projects:data.projects.filter(p=>p.kategori_id===active);list.innerHTML=items.map(p=>`<article class="card"><button data-id="${p.id}" style="border:0;padding:0;background:none;width:100%;text-align:left;cursor:pointer"><div class="media">${pics(p)[0]?`<img src="${pics(p)[0]}" alt="${esc(p.nama_proyek)}">`:esc((p.nama_proyek||'PR').slice(0,2))}</div><div class="body"><span class="tag">${esc(p.kategori_id)}</span><h2>${esc(p.nama_proyek)}</h2><p>${esc(p.deskripsi_singkat)}</p><span class="open">Lihat case study →</span></div></button></article>`).join('')||'<p>Belum ada proyek di kategori ini.</p>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(data.projects.find(p=>String(p.id)===b.dataset.id)));$('#filters').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{active=b.dataset.c;render()})}render();$('.close').onclick=()=>$('#dialog').close();$('#dialog').onclick=e=>{if(e.target===$('#dialog'))$('#dialog').close()};const id=new URLSearchParams(location.search).get('id');if(id){const p=data.projects.find(x=>String(x.id)===id);if(p)show(p)}})();</script></body></html>
