<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfcff">
  <title>Proyek — Isma Tiara Zalianti</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/logo-isma.jpeg">
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800&family=fraunces:500,600,700" rel="stylesheet">
  <link rel="stylesheet" href="/projects-page.css">
  <link rel="stylesheet" href="/portfolio-extras.css">
</head>
<body class="projects-page">
  <header>
    <nav class="project-nav" aria-label="Navigasi proyek">
      <a class="project-logo" href="/index.html#home" aria-label="Beranda Isma Tiara">
        <img src="/assets/images/logo-isma.jpeg" alt="Isma Tiara" data-logo>
      </a>
      <div class="project-nav-actions"><button class="language-toggle" type="button" aria-label="Change language">ID / EN</button><a class="project-back portfolio-return" href="/index.html#projects"><span aria-hidden="true">←</span> Portfolio</a></div>
    </nav>
  </header>

  <main class="project-shell">
    <section id="projectBrowse" class="project-hero">
      <p class="project-eyebrow">Selected Projects</p>
      <h1>Work that is clear, useful, and considered.</h1>
      <p class="project-intro">Koleksi proyek web, desain, dan aplikasi. Pilih karya untuk membaca detail serta melihat galeri yang terkait dengan proyek tersebut.</p>
    </section>
    <div id="projectTools" class="project-tools"></div>
    <section id="projectList" class="project-list" aria-label="Daftar proyek"></section>
    <article id="projectDetail" class="project-detail" hidden></article>
  </main>

  <footer class="projects-footer"><span>Isma Tiara Zalianti © <span id="projectYear"></span></span></footer>

  <dialog id="projectLightbox" aria-label="Pratinjau foto proyek">
    <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Tutup pratinjau">×</button>
    <img id="lightboxImage" class="lightbox-image" alt="">
  </dialog>

  <script src="/data.js"></script>
  <script src="/project-media.js"></script>
  <script src="/projects.js"></script>
  <script src="/page-language.js"></script>
  <script>
    document.querySelectorAll('[data-logo]').forEach(image => image.addEventListener('error', () => {
      const fallback = document.createElement('span');
      fallback.className = 'project-logo-text';
      fallback.textContent = 'Isma Tiara';
      image.replaceWith(fallback);
    }, { once: true }));
  </script>
</body>
</html>
