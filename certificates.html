<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificates — Isma Tiara</title><link rel="preconnect" href="https://fonts.bunny.net"><link href="https://fonts.bunny.net/css?family=figtree:400,600,700,800&family=fraunces:500,600,700" rel="stylesheet"><style>:root{--ink:#18214d;--muted:#68718c;--violet:#624cc8;--gold:#bc8b48;--line:#e7e9ef}*{box-sizing:border-box}body{margin:0;font-family:Figtree,sans-serif;background:#fcfcfb;color:var(--ink)}a{text-decoration:none;color:inherit}.nav,.wrap{max-width:1100px;margin:auto;padding-inline:24px}.nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{width:106px;height:48px;object-fit:contain;object-position:left}.back{border:1px solid #dce0eb;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:700}.hero{padding:68px 0 32px;max-width:660px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800}.eyebrow:before{content:'— ';color:var(--violet)}h1{font:600 clamp(42px,7vw,74px)/.96 Fraunces,serif;margin:12px 0}.intro{color:var(--muted);line-height:1.75}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:70px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 35px -28px #111b46}.image{height:205px;background:#f0eff5;display:grid;place-items:center;font:600 32px Fraunces,serif;color:#7067a9}.image img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.body b{display:block}.body span{display:block;color:var(--muted);font-size:12px;margin-top:6px}.detail{padding:48px 0 72px}.certificate{display:grid;grid-template-columns:1.25fr .75fr;gap:45px;margin-top:30px}.large{width:100%;max-height:70vh;object-fit:contain;background:#f0eff5;border-radius:14px}.info{color:var(--muted);line-height:1.7}.info h2{color:var(--ink);font:600 28px Fraunces,serif}.empty{padding:30px;color:var(--muted)}@media(max-width:700px){.grid,.certificate{grid-template-columns:1fr}.hero{padding-top:40px}}</style></head><body><nav class="nav"><a href="index.html"><img class="logo" src="assets/images/logo-isma.jpeg" alt="Isma Tiara"></a><a class="back" href="index.html#certificates">← Portfolio</a></nav><main class="wrap"><section id="browse" class="hero"><p class="eyebrow">Certificates</p><h1>Learning, always.</h1><p class="intro">Dokumen pencapaian pembelajaran. Pilih sertifikat untuk melihat detail dan gambar dalam ukuran yang proporsional.</p></section><section id="list" class="grid"></section><section id="detail" class="detail" hidden></section></main><script src="data.js"></script><script>(async()=>{const d=await getData(),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),slug=v=>String(v||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),seg=location.pathname.split('/').filter(Boolean),wanted=new URLSearchParams(location.search).get('slug')||(seg[0]==='certificates'?seg[1]:'');function detail(c){$('#browse').hidden=true;$('#list').hidden=true;$('#detail').hidden=false;$('#detail').innerHTML=`<a class="back" href="/certificates.html">← Semua sertifikat</a><p class="eyebrow">${esc(c.penerbit||'Certificate')}</p><h1>${esc(c.nama_sertifikat)}</h1><section class="certificate">${c.gambar?`<img class="large" src="${c.gambar}" alt="${esc(c.nama_sertifikat)}">`:'<div class="image">✦</div>'}<aside class="info"><h2>Certificate details</h2><p><b>Penerbit</b><br>${esc(c.penerbit||'—')}</p><p><b>Tahun</b><br>${esc(c.tahun||'—')}</p>${c.tautan_sertifikat?`<p><a href="${esc(c.tautan_sertifikat)}" target="_blank">Lihat kredensial ↗</a></p>`:''}</aside></section>`}const certs=d.certificates||[],c=certs.find(x=>slug(x.slug||x.nama_sertifikat)===wanted);if(c)detail(c);else $('#list').innerHTML=certs.map(c=>`<a class="card" href="/certificates/${slug(c.slug||c.nama_sertifikat)}"><div class="image">${c.gambar?`<img loading="lazy" src="${c.gambar}" alt="${esc(c.nama_sertifikat)}">`:'✦'}</div><div class="body"><b>${esc(c.nama_sertifikat)}</b><span>${esc(c.penerbit)} · ${esc(c.tahun)}</span></div></a>`).join('')||'<p class="empty">Belum ada sertifikat.</p>'})()</script></body></html>
