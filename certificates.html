<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificates — Isma Tiara</title><link rel="preconnect" href="https://fonts.bunny.net"><link href="https://fonts.bunny.net/css?family=figtree:400,600,700,800&family=fraunces:500,600" rel="stylesheet"><style>:root{--ink:#272873;--muted:#737aa4;--violet:#6250d6;--line:#e5e8fa}*{box-sizing:border-box}body{margin:0;font-family:Figtree,sans-serif;background:radial-gradient(circle at 85% 0,#f9e4ff,transparent 25rem),#fbfcff;color:var(--ink)}a{text-decoration:none;color:inherit}.nav,.wrap{max-width:1100px;margin:auto;padding-left:22px;padding-right:22px}.nav{height:78px;display:flex;align-items:center;justify-content:space-between}.logo{width:108px;height:50px;object-fit:contain;object-position:left}.back{border:1px solid #dadcf4;border-radius:999px;padding:10px 15px;background:#fff;color:var(--violet);font-weight:800;font-size:13px}.hero{padding:55px 0 30px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8d71db;font-weight:800}.eyebrow:before{content:'✦ ';color:#f3b643}h1{font:600 clamp(42px,7vw,70px)/.95 Fraunces,serif;margin:12px 0}.intro{max-width:530px;line-height:1.7;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:70px}.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 15px 36px -27px #45408a;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px)}.image{height:190px;background:linear-gradient(135deg,#e9e5ff,#c2dfff,#ffe7ac);display:grid;place-items:center;font:600 32px Fraunces,serif;color:#6555cc}.image img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.body b{display:block}.body span{display:block;color:var(--muted);font-size:12px;margin-top:5px}dialog{width:min(900px,94vw);border:0;border-radius:22px;padding:0}dialog::backdrop{background:#171333a6}.head{display:flex;justify-content:space-between;padding:19px 22px}.head h2{margin:0}.close{border:0;border-radius:50%;width:34px;height:34px;font-size:19px}.large{max-height:68vh;width:100%;object-fit:contain;background:#f4f4ff}.detail{padding:18px 22px;color:var(--muted)}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a href="index.html"><img class="logo" src="assets/images/logo-isma.jpeg" alt="Isma Portfolio"></a><a class="back" href="index.html#certificates">← Kembali ke portfolio</a></nav><main class="wrap"><section class="hero"><p class="eyebrow">Certificates</p><h1>Learning, always.</h1><p class="intro">Dokumen sertifikat dan pencapaian pembelajaran. Klik sertifikat untuk melihat versi lebih besar.</p></section><section id="list" class="grid"></section></main><dialog id="dialog"><article><div class="head"><div><h2 id="title"></h2><span id="meta"></span></div><button class="close">×</button></div><img id="image" class="large" alt=""><div id="detail" class="detail"></div></article></dialog><script src="data.js"></script><script>(async()=>{const d=await getData(),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function open(c){$('#title').textContent=c.nama_sertifikat;$('#meta').textContent=[c.penerbit,c.tahun].filter(Boolean).join(' · ');$('#detail').innerHTML=c.tautan_sertifikat?`<a href="${esc(c.tautan_sertifikat)}" target="_blank">Lihat kredensial ↗</a>`:'Placeholder akan diganti dengan gambar sertifikat asli dari CMS.';if(c.gambar){$('#image').src=c.gambar;$('#image').alt=c.nama_sertifikat}else{$('#image').removeAttribute('src')}$('#dialog').showModal()}$('#list').innerHTML=d.certificates.map(c=>`<article class="card" data-id="${c.id}"><div class="image">${c.gambar?`<img src="${c.gambar}" alt="${esc(c.nama_sertifikat)}">`:'✦'}</div><div class="body"><b>${esc(c.nama_sertifikat)}</b><span>${esc(c.penerbit)} · ${esc(c.tahun)}</span></div></article>`).join('')||'<p>Belum ada sertifikat.</p>';$('#list').querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>open(d.certificates.find(c=>String(c.id)===x.dataset.id)));$('.close').onclick=()=>$('#dialog').close();$('#dialog').onclick=e=>{if(e.target===$('#dialog'))$('#dialog').close()}})();</script></body></html>
