<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hobi — Isma Tiara</title><link rel="preconnect" href="https://fonts.bunny.net"><link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800&family=fraunces:500,600,600i,700" rel="stylesheet"><style>:root{--ink:#25266e;--muted:#747ba4;--violet:#6250d6;--soft:#ede9fe;--line:#e5e8fa}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Figtree,sans-serif;background:radial-gradient(circle at 90% 0,#fae4f9,transparent 26rem),radial-gradient(circle at 0 25%,#e8edff,transparent 28rem),#fbfcff}a{text-decoration:none;color:inherit}.nav,.wrap{max-width:1160px;margin:auto;padding-left:22px;padding-right:22px}.nav{height:78px;display:flex;align-items:center;justify-content:space-between}.logo{height:50px;width:108px;object-fit:contain;object-position:left}.back,.filter{border:1px solid #dcdcf5;border-radius:999px;padding:10px 15px;background:#fff;color:var(--violet);font-size:13px;font-weight:800;cursor:pointer}.hero{padding:55px 0 30px}.eyebrow{font-size:11px;font-weight:800;color:#8d71db;letter-spacing:.12em;text-transform:uppercase}.eyebrow:before{content:'✦ ';color:#f5b743}h1{font:600 clamp(43px,7vw,74px)/.96 Fraunces,serif;margin:12px 0}h1 em{font-style:italic;color:#7569dd}.intro{max-width:590px;color:var(--muted);line-height:1.7}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 24px}.filter.active{background:var(--violet);color:white;border-color:var(--violet)}.list{display:grid;gap:28px;padding-bottom:70px}.hobby{scroll-margin-top:95px;padding:22px;background:#ffffffd9;border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 38px -29px #48418a}.head{display:flex;gap:16px;align-items:center;margin-bottom:17px}.cover{width:62px;height:62px;flex:none;border-radius:17px;object-fit:cover;background:linear-gradient(135deg,#e0d9ff,#f7c7ec);display:grid;place-items:center;color:var(--violet);font-size:23px}.head h2{font:600 28px Fraunces,serif;margin:0 0 3px}.head p{margin:0;color:var(--muted);font-size:13px}.count{margin-left:auto;background:var(--soft);color:var(--violet);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.photo{border:0;padding:0;cursor:zoom-in;aspect-ratio:1;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#ebe7ff,#f9d8ef)}.photo img{width:100%;height:100%;object-fit:cover;transition:.25s}.photo:hover img{transform:scale(1.06)}.empty{grid-column:1/-1;padding:29px;text-align:center;border:1px dashed #c9c4f4;border-radius:15px;color:var(--muted);font-size:13px}dialog{border:0;border-radius:20px;padding:0;width:min(940px,94vw);background:#171331}dialog::backdrop{background:#171333b8}.lightbox{position:relative;padding:56px 52px 25px;min-height:300px}.lightbox img{display:block;max-width:100%;max-height:70vh;margin:auto;object-fit:contain}.x,.prev,.next{position:absolute;border:0;color:#fff;cursor:pointer;background:#ffffff26;border-radius:50%;width:40px;height:40px;font-size:23px}.x{right:12px;top:12px}.prev,.next{top:50%;transform:translateY(-50%)}.prev{left:10px}.next{right:10px}.caption{color:white;text-align:center;margin:15px 0 0;font-size:13px}@media(max-width:650px){.hero{padding-top:35px}.gallery{grid-template-columns:repeat(2,1fr)}.count{display:none}.head{align-items:flex-start}.lightbox{padding:50px 36px 20px}}</style></head><body><nav class="nav"><a href="index.html"><img class="logo" src="assets/images/logo-isma.jpeg" alt="Isma Portfolio"></a><a class="back" href="index.html#hobbies">← Kembali ke portfolio</a></nav><main class="wrap"><section class="hero"><p class="eyebrow">My little world</p><h1>Stories beyond <em>the screen.</em></h1><p class="intro">Hal-hal kecil yang saya sukai untuk mengisi energi, belajar melihat dunia, dan menyimpan cerita. Klik foto untuk melihatnya lebih dekat.</p></section><div id="filters" class="filters"></div><section id="list" class="list"></section></main><dialog id="lightbox"><div class="lightbox"><button class="x" aria-label="Tutup">×</button><button class="prev" aria-label="Foto sebelumnya">‹</button><img id="lightboxImage" alt=""><button class="next" aria-label="Foto berikutnya">›</button><p id="caption" class="caption"></p></div></dialog><script src="data.js"></script><script>(async()=>{const data=await getData(),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let active='All',current=[],position=0;const initials=v=>String(v||'H').split(/\s+/).map(x=>x[0]).join('').slice(0,2);const photos=i=>[i.gambar,...(Array.isArray(i.gallery)?i.gallery:[])].filter(Boolean);function open(items,n,name){current=items;position=n;$('#caption').textContent=`${name} · Foto ${n+1} dari ${items.length}`;$('#lightboxImage').src=items[n];$('#lightboxImage').alt=`${name} foto ${n+1}`;$('#lightbox').showModal()}function move(step){if(!current.length)return;position=(position+step+current.length)%current.length;$('#lightboxImage').src=current[position];$('#caption').textContent=$('#caption').textContent.replace(/Foto \d+ dari/,`Foto ${position+1} dari`)}function render(){const hobbies=data.beyond||[], cats=['All',...hobbies.map(h=>h.nama)];$('#filters').innerHTML=cats.map(c=>`<button class="filter ${c===active?'active':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');const list=active==='All'?hobbies:hobbies.filter(h=>h.nama===active);$('#list').innerHTML=list.map(h=>{const pics=photos(h);return `<article class="hobby" id="hobby-${h.id}"><div class="head">${h.gambar?`<img class="cover" src="${h.gambar}" alt="${esc(h.nama)}">`:`<div class="cover">${initials(h.nama)}</div>`}<div><h2>${esc(h.nama)}</h2><p>${esc(h.deskripsi)}</p></div><span class="count">${pics.length} foto</span></div><div class="gallery">${pics.length?pics.map((src,n)=>`<button class="photo" data-id="${h.id}" data-n="${n}"><img src="${src}" alt="${esc(h.nama)} foto ${n+1}"></button>`).join(''):'<div class="empty">Galeri masih kosong. Tambahkan foto dari Admin → Hobi &amp; Galeri.</div>'}</div></article>`}).join('')||'<p class="empty">Belum ada hobi.</p>';$('#list').querySelectorAll('.photo').forEach(b=>b.onclick=()=>{const h=hobbies.find(x=>String(x.id)===b.dataset.id);open(photos(h),Number(b.dataset.n),h.nama)});$('#filters').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{active=b.dataset.c;render()})}render();$('.x').onclick=()=>$('#lightbox').close();$('.prev').onclick=()=>move(-1);$('.next').onclick=()=>move(1);$('#lightbox').onclick=e=>{if(e.target===$('#lightbox'))$('#lightbox').close()};document.addEventListener('keydown',e=>{if(!$('#lightbox').open)return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});})();</script></body></html>
