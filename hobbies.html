<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hobbies — Isma Tiara</title><link rel="preconnect" href="https://fonts.bunny.net"><link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800&family=fraunces:500,600,700" rel="stylesheet"><style>:root{--ink:#18214d;--muted:#68718c;--violet:#624cc8;--gold:#bc8b48;--line:#e7e9ef}*{box-sizing:border-box}body{margin:0;font-family:Figtree,sans-serif;background:#fcfcfb;color:var(--ink)}a{text-decoration:none;color:inherit}.nav,.wrap{max-width:1120px;margin:auto;padding-inline:24px}.nav{height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.logo{height:48px;width:106px;object-fit:contain;object-position:left}.back{border:1px solid #dce0eb;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:700}.hero{padding:68px 0 32px;max-width:680px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800}.eyebrow:before{content:'— ';color:var(--violet)}h1{font:600 clamp(42px,7vw,74px)/.96 Fraunces,serif;margin:12px 0}.intro,.copy{color:var(--muted);line-height:1.75}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:70px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 35px -28px #111b46}.image{height:230px;background:#f0eff5;display:grid;place-items:center;font:600 32px Fraunces,serif;color:#7067a9}.image img{height:100%;width:100%;object-fit:cover}.body{padding:17px}.body h2{margin:0 0 6px;font-size:19px}.body p{font-size:13px;color:var(--muted);line-height:1.55;margin:0}.detail{padding:48px 0 72px}.detail h1{max-width:740px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.photo{border:0;padding:0;background:#f0eff5;aspect-ratio:1;overflow:hidden;border-radius:12px;cursor:zoom-in}.photo img{width:100%;height:100%;object-fit:cover;transition:.3s}.photo:hover img{transform:scale(1.04)}.empty{padding:30px;color:var(--muted)}dialog{width:min(1000px,95vw);border:0;padding:0;background:#11152b}dialog::backdrop{background:#11152bcc}.light{position:relative;padding:50px}.light img{display:block;max-width:100%;max-height:75vh;margin:auto}.x{position:absolute;right:10px;top:10px;border:0;border-radius:50%;width:35px;height:35px;background:#ffffff22;color:#fff;font-size:20px}@media(max-width:700px){.grid,.gallery{grid-template-columns:1fr}.hero{padding-top:40px}.gallery{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><nav class="nav"><a href="index.html"><img class="logo" src="assets/images/logo-isma.jpeg" alt="Isma Tiara"></a><a class="back" href="index.html#hobbies">← Portfolio</a></nav><main class="wrap"><section id="browse" class="hero"><p class="eyebrow">My little world</p><h1>Stories beyond the screen.</h1><p class="intro">Koleksi hobi dan hal kecil yang saya nikmati. Setiap hobi memiliki halaman dan galeri fotonya sendiri.</p></section><section id="list" class="grid"></section><section id="detail" class="detail" hidden></section></main><dialog id="light"><div class="light"><button class="x">×</button><img id="lightImage" alt=""></div></dialog><script src="data.js"></script><script>(async()=>{const d=await getData(),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),slug=v=>String(v||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),photos=x=>[x.gambar,...(x.gallery||[])].filter(Boolean);const seg=location.pathname.split('/').filter(Boolean),wanted=new URLSearchParams(location.search).get('slug')||(seg[0]==='hobbies'?seg[1]:'');function detail(x){$('#browse').hidden=true;$('#list').hidden=true;$('#detail').hidden=false;const pic=photos(x);$('#detail').innerHTML=`<a class="back" href="/hobbies.html">← Semua hobi</a><p class="eyebrow">My little world</p><h1>${esc(x.nama)}</h1><p class="intro">${esc(x.deskripsi)}</p><div class="gallery">${pic.length?pic.map((s,i)=>`<button class="photo" data-i="${i}"><img loading="lazy" src="${s}" alt="${esc(x.nama)} foto ${i+1}"></button>`).join(''):'<p class="empty">Belum ada foto. Galeri ini dapat ditambahkan dari Admin → Hobi & Galeri.</p>'}</div>`;$('#detail').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{$('#lightImage').src=pic[Number(b.dataset.i)];$('#light').showModal()})}const hobbies=d.beyond||[],item=hobbies.find(x=>slug(x.nama)===wanted);if(item)detail(item);else $('#list').innerHTML=hobbies.map(x=>`<a class="card" href="/hobbies/${slug(x.nama)}"><div class="image">${x.gambar?`<img loading="lazy" src="${x.gambar}" alt="${esc(x.nama)}">`:esc(x.nama.slice(0,2))}</div><div class="body"><h2>${esc(x.nama)}</h2><p>${esc(x.deskripsi)}</p></div></a>`).join('')||'<p class="empty">Belum ada hobi.</p>';$('.x').onclick=()=>$('#light').close();$('#light').onclick=e=>{if(e.target===$('#light'))$('#light').close()}})();</script></body></html>
