<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hobi — Isma Tiara Zalianti</title><link rel="icon" type="image/jpeg" href="assets/images/logo-isma.jpeg"><link rel="preconnect" href="https://fonts.bunny.net"><link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800&family=fraunces:500,600,600i,700" rel="stylesheet"><style>:root{--ink:#1c1530;--muted:#726c85;--violet:#5b21b6;--violet-soft:#ede9fe;--border:#e8e3f4}*{box-sizing:border-box}body{margin:0;font-family:Figtree,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 90% 0,#fce7f3,transparent 28rem),radial-gradient(circle at 5% 25%,#ede9fe,transparent 32rem),#fff}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:4;background:#fffffff0;backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}nav{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{height:44px;width:110px;object-fit:contain;object-position:left}.back{padding:10px 17px;border:1px solid #ddd6fe;border-radius:999px;color:var(--violet);font-weight:700}.wrap{max-width:1200px;margin:auto;padding:66px 20px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#a16207}.eyebrow:before{content:'✦ ';color:var(--violet)}h1,h2{font-family:Fraunces,serif}h1{max-width:700px;font-size:clamp(42px,7vw,74px);line-height:1.02;margin:14px 0;color:#281549}h1 em{font-style:italic;color:var(--violet)}.intro{max-width:620px;color:var(--muted);font-size:17px;line-height:1.75}.list{display:grid;gap:34px;margin-top:46px}.hobby{scroll-margin-top:90px;background:#ffffffc9;border:1px solid var(--border);border-radius:26px;padding:24px;box-shadow:0 20px 45px -35px #27114f}.hobby-head{display:flex;gap:17px;align-items:center;margin-bottom:20px}.cover{width:66px;height:66px;flex:none;border-radius:18px;object-fit:cover;background:linear-gradient(135deg,#ddd6fe,#fbcfe8);display:grid;place-items:center;font-size:26px;color:var(--violet)}.hobby h2{font-size:28px;margin:0 0 5px}.hobby p{margin:0;color:var(--muted);line-height:1.6}.count{margin-left:auto;background:var(--violet-soft);color:var(--violet);border-radius:999px;padding:7px 11px;white-space:nowrap;font-size:13px;font-weight:700}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.photo{aspect-ratio:1;border-radius:15px;overflow:hidden;background:linear-gradient(135deg,#ede9fe,#fce7f3)}.photo img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.photo:hover img{transform:scale(1.05)}.empty{grid-column:1/-1;padding:35px;text-align:center;border:1px dashed #c4b5fd;border-radius:16px;color:var(--muted);background:#faf8ff}.empty b{display:block;color:var(--violet);margin-bottom:5px}@media(max-width:720px){.wrap{padding:46px 16px}.hobby{padding:18px}.gallery{grid-template-columns:repeat(2,1fr)}.count{display:none}.hobby-head{align-items:flex-start}}</style></head><body><header><nav><a href="index.html"><img class="logo" src="assets/images/logo-isma.jpeg" alt="Isma Studio"></a><a class="back" href="index.html#hobbies">← Kembali ke portfolio</a></nav></header><main class="wrap"><p class="eyebrow">Beyond work</p><h1>Ruang kecil untuk <em>hobi</em> dan cerita.</h1><p class="intro">Kumpulan aktivitas yang saya nikmati di luar pekerjaan. Pilih hobi di halaman utama atau jelajahi foto-fotonya di sini.</p><div id="hobbyList" class="list"></div></main><script src="data.js"></script><script>(async()=>{const data=await getData();const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const initials=v=>String(v||'H').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();const all=i=>[i.gambar,...(Array.isArray(i.gallery)?i.gallery:[])].filter(Boolean);document.querySelector('#hobbyList').innerHTML=(data.beyond||[]).map(item=>{const photos=all(item);return `<article class="hobby" id="hobby-${item.id}"><div class="hobby-head">${item.gambar?`<img class="cover" src="${item.gambar}" alt="${esc(item.nama)}">`:`<div class="cover">${initials(item.nama)}</div>`}<div><h2>${esc(item.nama)}</h2><p>${esc(item.deskripsi)}</p></div><span class="count">${photos.length} foto</span></div><div class="gallery">${photos.length?photos.map((src,n)=>`<a class="photo" href="${src}" target="_blank" rel="noreferrer"><img src="${src}" alt="${esc(item.nama)} foto ${n+1}"></a>`).join(''):`<div class="empty"><b>Galeri masih kosong</b>Tambah beberapa foto lewat Admin → Hobi &amp; Galeri.</div>`}</div></article>`}).join('')||'<div class="empty"><b>Belum ada hobi</b>Tambahkan data dari halaman admin.</div>';})();</script></body></html>
